[package]
name = "multisig-glue"
version = "0.1.0"
edition = "2021"

[dependencies]
# Same crate and rev as hashsig-glue: an aggregate verifies only against keys and
# signatures from the leanVM rev that produced it.
leanvm = { git = "https://github.com/leanEthereum/leanVM.git", rev = "022ec377a39de6c6982cb0d88799d54b05d5c981" }

[lib]
# Built as an rlib so its `#[no_mangle] pub extern "C"` symbols can be
# funnelled through the `cgo-glue` staticlib shim. See cgo-glue/Cargo.toml.
crate-type = ["rlib"]
name = "multisig_glue"
