[package]
name = "hashsig-glue"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.9"
# XMSS comes from leanVM's root `leanvm` crate, which also re-exports the SSZ traits
# its key and signature types implement. multisig-glue depends on the same crate:
# keep both on one rev, since keys, signatures and aggregates only verify within it.
leanvm = { git = "https://github.com/leanEthereum/leanVM.git", rev = "022ec377a39de6c6982cb0d88799d54b05d5c981" }
# XmssSecretKey is serde-only (SSZ deliberately excluded upstream); persist it
# with postcard. The secret key never goes on the wire, so the format is local.
postcard = { version = "1.1.3", features = ["alloc"] }

[features]
# Inert: leanVM's xmss is a single instantiation (no short-lifetime test variant).
# Key-gen cost scales with the active-slot count, not the 2^32 lifetime, so tests
# stay cheap without a separate config. Kept so build invocations don't break.
test-config = []

[lib]
# Built as an rlib so its `#[no_mangle] pub extern "C"` symbols can be
# funnelled through the `cgo-glue` staticlib shim. See cgo-glue/Cargo.toml.
crate-type = ["rlib"]
name = "hashsig_glue"
