name: Spec Tests

on:
  pull_request:
    paths:
      - "lean/consensus/**"
      - "lean/spectests/**"
      - "lean/internal/specfixtures/**"
      - "Makefile"
      - ".github/workflows/spec-tests.yml"

env:
  GO_VERSION: "1.26.11"
  # Builds the XMSS FFI the signature and proof suites link against; matches
  # lean/crypto/xmss/rust/rust-toolchain.toml. Fixtures are downloaded, not generated.
  RUST_VERSION: "1.92"

jobs:
  spec-tests:
    name: Consensus Spec Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lean/crypto/xmss/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('lean/crypto/xmss/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run spec tests
        run: make test-spec
