name: Spec Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "consensus/statetransition/**"
      - "consensus/forkchoice/**"
      - "internal/spectests/**"
      - "types/**"
      - "Makefile"

env:
  GO_VERSION: "1.25.12"
  # Fixture generation compiles the spec's prover toolchain (lean-multisig-py ->
  # leanMultisig -> Plonky3), which uses nightly-only features (e.g.
  # maybe_uninit_slice). This job builds no gean FFI — that stays pinned to
  # 1.92 via crypto/xmss/rust/rust-toolchain.toml — so nightly here is isolated.
  RUST_VERSION: "nightly"

jobs:
  spec-tests:
    name: Consensus Spec Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crypto/xmss/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crypto/xmss/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run spec tests
        run: make test-spec
