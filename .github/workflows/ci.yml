name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  XMSS_RUST: internal/core/crypto/xmss/rust

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Installs the toolchain rust-toolchain.toml pins.
      # rustup installs the pinned toolchain without the components asked for here, so they
      # are added once it is in place.
      - run: rustup toolchain install --profile minimal && rustup component add clippy rustfmt
        working-directory: ${{ env.XMSS_RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.XMSS_RUST }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # make lint leaves formatting to gofmt.
      - run: "! gofmt -l . | grep ."
      - run: go mod tidy -diff
      # add -N makes a newly generated file part of the diff.
      - run: make lean-sszgen && git add -N internal/lean/types && git diff --exit-code
      - run: make lint
      # make lint and make test build only the default variant.
      - run: go vet -tags fakecrypto ./... && go vet -tags spectests,sim ./testing/...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install --profile minimal
        working-directory: ${{ env.XMSS_RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.XMSS_RUST }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make test
        env:
          GOFLAGS: -race
      # The XMSS package's tests beyond the scheme vector, which make test leaves out to stay
      # quick locally: real key generation, signing, verification and aggregation, in under a
      # minute and about 2 GB.
      - run: make lean-test-ffi
        env:
          GOFLAGS: -race
      # Keyed on the fixtures' pinned hash rather than the whole Makefile, so only a new pin
      # downloads them again. The restored directory holds make's .sha256-<hash> stamp, so
      # make skips the download.
      - id: fixtures
        run: echo "sha256=$(sed -n 's/^LEAN_SPEC_FIXTURES_SHA256 := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: leanSpec/fixtures
          key: leanspec-fixtures-${{ steps.fixtures.outputs.sha256 }}
      - run: make lean-spectest

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The one run with several nodes in a process, so where -race finds the most;
      # its time is slot waits, so the detector costs almost nothing.
      - run: make lean-e2e
        env:
          GOFLAGS: -race

  # Devnets run gean from this image, and its build can break where make build passes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check branch protection requires, so adding a job doesn't mean updating the rule.
  success:
    if: always()
    needs: [lint, test, e2e, docker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
