name: ci

on:
  pull_request:
  # A push to pq saves the spec-test cache that pull requests into pq read.
  push:
    branches: [main, pq]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  XMSS_RUST: internal/core/crypto/xmss/rust

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Installs the toolchain rust-toolchain.toml pins.
      # rustup installs the pinned toolchain without the components asked for here, so they
      # are added once it is in place.
      - run: rustup toolchain install --profile minimal && rustup component add clippy rustfmt
        working-directory: ${{ env.XMSS_RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.XMSS_RUST }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # make lint leaves formatting to gofmt.
      - run: "! gofmt -l . | grep ."
      - run: go mod tidy -diff
      - run: make lint
      - run: make vet

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install --profile minimal
        working-directory: ${{ env.XMSS_RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.XMSS_RUST }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make test
        env:
          GOFLAGS: -race
      # The XMSS package's tests beyond the scheme vector, which make test leaves out to stay
      # quick locally: real key generation, signing, verification and aggregation, in under a
      # minute and about 2 GB.
      - run: make test-ffi
        env:
          GOFLAGS: -race

  # The consensus-specs reference tests. Generating them takes over an hour, so they are cached per
  # pinned commit, and saved as soon as they are generated so a failing run still keeps them. A
  # pull request reads the cache its base branch saved. The timeout allows for a full generation.
  spectest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spectests
          key: spectests-${{ hashFiles('pins.env') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - if: steps.cache.outputs.cache-hit != 'true'
        run: make spec-pq
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spectests
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Which upstream tests failed while generating, and why.
      - if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consensus-specs-test-report
          path: .consensus-specs/tests/core/pyspec/test-reports/
          if-no-files-found: ignore
      - run: make spectest
        env:
          GEAN_REQUIRE_SPEC_TESTS: "1"

  # Lines of code per package against the base branch, in the job summary. It only informs, so
  # a failure to count fails nothing.
  loc:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          git fetch --depth=1 origin -- "$BASE_REF"
          {
            echo "### Lines of code against $BASE_REF"
            make --no-print-directory loc BASE=FETCH_HEAD
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_REF: ${{ github.base_ref }}

  # The image build can break where make build passes. On main the image workflow builds it
  # anyway, and its registry cache is read here.
  docker:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-amd64

  # The one check branch protection requires, so adding a job doesn't mean updating the rule.
  success:
    if: always()
    needs: [lint, test, docker, spectest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
