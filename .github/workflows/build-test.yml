name: Build & Test

on:
  push:
    branches: [main, "devnet-*"]
  pull_request:

env:
  GO_VERSION: "1.26.10"
  RUST_VERSION: "1.92"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lean/crypto/xmss/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('lean/crypto/xmss/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build FFI library
        run: make ffi

      - name: Build binaries
        run: make build

      - name: Check Go bugs and unused code
        run: make check-go

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: go test -race ./lean/internal/chain ./lean/internal/store ./lean/internal/prover ./lean/consensus/forkchoice ./lean/internal/api -count=1
