# Publishes ghcr.io/geanlabs/gean, for amd64 and arm64:
#
#   push to main       -> `unstable`, and `sha-<7>`, which never moves.
#   workflow_dispatch  -> the `tags` input and `sha-<7>`, for the chosen ref.
#
# Each published image is attested.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to publish, comma-separated (devnet6,devnet6-fix). Empty builds without publishing."

permissions: {}

# A group keeps one waiting run, and a newer one replaces it, so pushes and dispatches queue
# apart: a push must not drop a devnet tag's dispatch. Pushes run in order, so `unstable` ends
# on the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      # `unstable` belongs to main and `sha-*` is added to every publish, so a hand-picked
      # tag never overwrites either.
      - id: tags
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            tags=unstable
          else
            tags=$(tr -d ' ' <<< "$INPUT" | tr ',' ' ')
            for t in $tags; do
              if [[ ! $t =~ ^[a-z0-9][a-z0-9._-]{0,127}$ || $t =~ ^(unstable|latest|sha-.*)$ ]]; then
                echo "::error::'$t' is not a tag this workflow publishes by hand"
                exit 1
              fi
            done
          fi
          if [ -n "$tags" ]; then tags="$tags sha-${SHA::7}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: tags
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.tags.outputs.tags != '' }}
      CACHE: ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest alone; the publish job names the two as one image. The layer cache
      # lives in the registry rather than the Actions cache, whose 10 GB the CI caches need,
      # and only main writes it.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          # The image is attested below instead, as one index rather than per architecture.
          provenance: false
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ env.PUBLISH == 'true' && github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=max,ignore-error=true', env.CACHE) || '' }}
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [tags, build]
    if: needs.tags.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: index
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$IMAGE:$t"); done
          for d in digests/*; do args+=("$IMAGE@sha256:${d#digests/}"); done
          docker buildx imagetools create "${args[@]}"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:${TAGS##* }" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
