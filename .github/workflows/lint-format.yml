name: Lint & Format

on:
  pull_request:

env:
  GO_VERSION: "1.26.11"
  RUST_VERSION: "1.92"

jobs:
  go-lint:
    name: Go Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check architecture boundaries
        run: make check-architecture

      - name: Check go fmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lean/crypto/xmss/rust/target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('lean/crypto/xmss/rust/Cargo.lock') }}
          restore-keys: |
            cargo-lint-${{ runner.os }}-

      - name: Check Rust formatting
        working-directory: lean/crypto/xmss/rust
        run: |
          rustup component add --toolchain 1.92.0-x86_64-unknown-linux-gnu rustfmt
          cargo fmt --check

      - name: Run Clippy
        working-directory: lean/crypto/xmss/rust
        run: |
          rustup component add --toolchain 1.92.0-x86_64-unknown-linux-gnu clippy
          cargo clippy -- -D warnings -A clippy::missing_safety_doc
