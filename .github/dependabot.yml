version: 2

# The deps prefix gives every pull request a title the titles workflow accepts. The cooldown
# leaves a release a week to be yanked before it is proposed.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    ignore:
      # go-libp2p's v6 tags predate its Go module, and every release since is v0.x.
      - dependency-name: github.com/libp2p/go-libp2p
        versions: [">= 1.0.0"]
      # snappy has no release after v1.0.0, so Dependabot would propose untagged commits.
      - dependency-name: github.com/golang/snappy
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /internal/core/crypto/xmss/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # A leanVM bump can change the XMSS scheme and invalidate every key, so it is made by hand.
    ignore:
      - dependency-name: leanvm
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
