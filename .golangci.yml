# golangci-lint v2 configuration.
#
# Run with `make lint`. The depguard import rules fail the build; other
# findings are reported without failing it.

version: "2"

run:
  go: "1.26"

linters:
  default: none
  enable:
    # Correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Integer conversions that can overflow (gosec G115).
    - gosec
    # Banned imports and package layering.
    - depguard

  settings:
    govet:
      # copylocks and lostcancel are on by default; nilness is not.
      enable:
        - nilness

    gosec:
      includes:
        - G115

    depguard:
      rules:
        # Package layering.
        types-imports-nothing:
          files:
            - "**/internal/lean/types/**"
          deny:
            - pkg: github.com/geanlabs/gean
              desc: "lean/types is the bottom layer and imports no other gean package"

        # Protocol rules depend only on the standard library, lean/types and,
        # for fork choice, the chain-agnostic proto-array tree.
        # Strict mode: anything not in the allow list is rejected.
        rules-import-only-types:
          list-mode: strict
          files:
            - "**/internal/lean/transition/**"
            - "**/internal/lean/forkchoice/**"
          allow:
            - $gostd
            - github.com/geanlabs/gean/internal/lean/types
            - github.com/geanlabs/gean/internal/core/protoarray

        storage-imports-nothing:
          files:
            - "**/internal/core/storage/**"
          deny:
            - pkg: github.com/geanlabs/gean
              desc: "storage is generic and imports no other gean package"

        # Chain layering: core/ is chain-agnostic, tests included, and each
        # chain stays independent of the others.
        core-is-chain-agnostic:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/geanlabs/gean/internal/lean
              desc: "core never imports a chain"
            - pkg: github.com/geanlabs/gean/internal/beacon
              desc: "core never imports a chain"
            - pkg: github.com/geanlabs/gean/internal/validator
              desc: "core never imports the validator client"

        lean-stays-lean:
          files:
            - "**/internal/lean/**"
          deny:
            - pkg: github.com/geanlabs/gean/internal/beacon
              desc: "lean and beacon never import each other"
            - pkg: github.com/geanlabs/gean/internal/validator
              desc: "lean never imports the beacon validator client"

        beacon-stays-beacon:
          files:
            - "**/internal/beacon/**"
          deny:
            - pkg: github.com/geanlabs/gean/internal/lean
              desc: "lean and beacon never import each other"
            - pkg: github.com/geanlabs/gean/internal/validator
              desc: "the beacon node never imports the validator client"

        validator-uses-api-only:
          files:
            - "**/internal/validator/**"
          deny:
            - pkg: github.com/geanlabs/gean/internal/lean
              desc: "the validator client is beacon-only"
            - pkg: github.com/geanlabs/gean/internal/beacon/importer
              desc: "the validator client talks to the node through the Beacon API"
            - pkg: github.com/geanlabs/gean/internal/beacon/store
              desc: "the validator client talks to the node through the Beacon API"
            - pkg: github.com/geanlabs/gean/internal/beacon/p2p
              desc: "the validator client talks to the node through the Beacon API"
            - pkg: github.com/geanlabs/gean/internal/beacon/syncer
              desc: "the validator client talks to the node through the Beacon API"

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may convert integers freely.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/geanlabs/gean
  exclusions:
    generated: lax
