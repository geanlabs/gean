# golangci-lint v2 configuration.
#
# Run with `make lint`. Any finding fails it.

version: "2"

run:
  go: "1.26"

linters:
  default: none
  enable:
    # Correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Integer conversions that can overflow (gosec G115).
    - gosec
    # Banned imports and package layering.
    - depguard

  settings:
    govet:
      # copylocks and lostcancel are on by default; nilness is not.
      enable:
        - nilness

    gosec:
      includes:
        - G115

    depguard:
      rules:
        # Package layering.
        storage-imports-nothing:
          files:
            - "**/internal/core/storage/**"
          deny:
            - pkg: github.com/geanlabs/gean
              desc: "storage is generic and imports no other gean package"

        # core is chain-agnostic, tests included: from gean it imports only core.
        # An allow entry is a longer match than the deny, so it wins.
        core-imports-only-core:
          list-mode: lax
          files:
            - "**/internal/core/**"
          allow:
            - github.com/geanlabs/gean/internal/core
          deny:
            - pkg: github.com/geanlabs/gean
              desc: "core imports nothing from gean outside core"

        # types and crypto sit just above core.
        types-and-crypto-import-only-core:
          list-mode: lax
          files:
            - "**/internal/types/**"
            - "**/internal/crypto/**"
          allow:
            - github.com/geanlabs/gean/internal/core
            - github.com/geanlabs/gean/internal/types
            - github.com/geanlabs/gean/internal/crypto
          deny:
            - pkg: github.com/geanlabs/gean
              desc: "types and crypto import from gean only core, types and crypto"

        # The consensus rules import no network, disk or execution client code from gean.
        consensus-imports-only-lower:
          list-mode: lax
          files:
            - "**/internal/state/**"
            - "**/internal/transition/**"
            - "**/internal/forkchoice/**"
          allow:
            - github.com/geanlabs/gean/internal/core
            - github.com/geanlabs/gean/internal/types
            - github.com/geanlabs/gean/internal/crypto
            - github.com/geanlabs/gean/internal/state
            - github.com/geanlabs/gean/internal/transition
            - github.com/geanlabs/gean/internal/forkchoice
          deny:
            - pkg: github.com/geanlabs/gean
              desc: "consensus rules import from gean only core, types, crypto and each other"

        # node wires everything together: cmd/gean starts it, and so may tests under testing/.
        only-cmd-imports-node:
          files:
            - "**/internal/**"
            - "!**/internal/node/**"
          deny:
            - pkg: github.com/geanlabs/gean/internal/node
              desc: "only cmd/gean and testing/ import node"

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may convert integers freely.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/geanlabs/gean
  exclusions:
    generated: lax
