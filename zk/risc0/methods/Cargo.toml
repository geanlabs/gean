# Builds zk/risc0/guest with risc0-build and writes the program binary to the
# path given as its argument (make zk-guest ZKVM=risc0).
[package]
name = "stf-risc0-methods"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
risc0-build = "=3.0.6"

[package.metadata.risc0]
methods = ["../guest"]
